<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo | Esencia Andina</title>
  <link rel="stylesheet" href="../styles/style.css" />
</head>
<body>
  
  <header>
    <div class="logo">
      <div class="logo-icon">🌿</div>
      <span>Esencia Andina</span>
    </div>

    <nav aria-label="Navegación principal">
      <a href="../index.html">Inicio</a>
      <a class="active" href="catalog.html">Catálogo</a>
      <a href="../index.html#carrito">Carrito</a>
      <a href="contact.html">Contacto</a>
    </nav>
  </header>

  <main>
    <section id="catalogo">
      <div class="section-title">
        <div>
          <h2>Todos los extractos</h2>
          <p>Explora nuestra colección completa de extractos naturales.</p>
        </div>
        <p class="summary-chip" id="catalog-count">6 extractos</p>
      </div>

      <div class="products" id="catalog-container">
        
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 Esencia Andina. Extractos premium para perfumería artesanal.</p>
    <p id="footer-summary" style="color: var(--text); font-weight: 700;"></p>
    <div class="socials" aria-label="Redes sociales">
      <a href="#" aria-label="Instagram">◎</a>
      <a href="#" aria-label="Facebook">◉</a>
      <a href="#" aria-label="WhatsApp">⬡</a>
    </div>
  </footer>

  <script src="../js/app.js" defer></script>
  <script>
    // Una vez cargado el DOM, se renderizan todos los productos
    document.addEventListener("DOMContentLoaded", () => {
      const catalogContainer = document.getElementById("catalog-container");
      const catalogCount = document.getElementById("catalog-count");

      if (catalogContainer && typeof renderProducts !== "undefined") {
        renderProducts(products);
        catalogCount.textContent = `${products.length} extractos`;
      }
    });
  </script>
</body>
</html>
