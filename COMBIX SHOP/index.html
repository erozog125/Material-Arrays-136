<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>COMBIX SHOP</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">
            <h1>COMBIX SHOP</h1>
            <p>Los mejores artículos gamer 🔥</p>
        </div>

    </header>

    <!-- MAIN -->

    <main>

        <!-- PRODUCTOS -->

        <section class="productos-container">

            <h2>Catálogo Gamer</h2>

            <!-- BUSCADOR -->

<div class="buscador">

    <input 
        type="text" 
        id="buscador"
        placeholder="Buscar productos gamer..."
    >

</div>

<!-- PRODUCTOS -->

<div id="productos" class="productos"></div>

        </section>

        <!-- CARRITO -->

        <aside class="carrito-container">

            <h2>Carrito</h2>

            <div id="carrito"></div>

            <div class="total">
                <h3>Total: $<span id="total">0</span></h3>
            </div>

        </aside>

    </main>

    <!-- FOOTER -->

    <footer>

        <p>COMBIX SHOP - Tienda Virtual Gamer</p>

    </footer>

    <script src="js/script.js"></script>

</body>

</html>
