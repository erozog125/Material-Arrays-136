<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Motors | Premium Sportbikes</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<header class="navbar">
    <div class="logo">
        <span class="logo-icon">🏍️</span> APEX<span class="logo-accent">MOTORS</span>
    </div>
    <div class="cart-trigger" aria-expanded="false" aria-label="Abrir carrito">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span id="cart-count" class="cart-badge">0</span>
    </div>
</header>

<body>
    <section class="hero">
    <div class="hero-content">
        <h1>Domina la pista.</h1>
        <p>Encuentra las mejores superbikes del mercado listas para agregar a tu garaje virtual.</p>
    </div>
</section>

<div class="oferta-banner">
    <div class="oferta-content">
        <span class="oferta-label">🔥 Oferta de temporada — termina en:</span>
        <div class="countdown-timer">
            <div class="time-block"><span id="countdown-dias">00</span><small>días</small></div>
            <span class="separator">:</span>
            <div class="time-block"><span id="countdown-horas">00</span><small>hrs</small></div>
            <span class="separator">:</span>
            <div class="time-block"><span id="countdown-minutos">00</span><small>min</small></div>
            <span class="separator">:</span>
            <div class="time-block"><span id="countdown-segundos">00</span><small>seg</small></div>
        </div>
    </div>
</div>

<main class="dashboard">
    <section class="catalog-section">
        <h2 class="section-title">Catálogo Premium</h2>
        <!-- Las cards se generarán dinámicamente con JS -->
        <div id="product-list" class="product-grid"></div>
    </section>
    <aside class="cart-sidebar">
    <div class="cart-glass">
        <h2 class="cart-title">Tu Garaje <span>(Carrito)</span></h2>
        <div id="cart-items" class="cart-items-wrapper">
            <div class="empty-state">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="none" stroke="#475569" stroke-width="1.5">
                    <circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <p>No tienes motos seleccionadas.</p>
            </div>
        </div>
        <div class="cart-footer">
            <div class="total-row">
                <span>Total estimado:</span>
                <h3>$<span id="cart-total">0</span></h3>
            </div>
            <div class="cart-actions">
                <button id="btn-buy" class="btn-checkout">Comprar Todo</button>
                <button id="btn-empty" class="btn-clear">Vaciar</button>
            </div>
        </div>
    </div>
</aside>
</main>
    <script src="script.js"></script>
</body>
</html>
