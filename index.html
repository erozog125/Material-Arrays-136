<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tienda Virtual — Electrónica y accesorios tech al mejor precio." />
    <title>Tienda Virtual</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/animations.css" />
  </head>
  <body>

    <!-- Fondo animado aurora -->
    <canvas id="aurora" aria-hidden="true"></canvas>

    <header>
      <h1>Tienda Virtual</h1>

      <button id="open-cart" class="cart-btn" aria-label="Abrir carrito de compras">
        🛒 Carrito (<span id="cart-count">0</span>)
      </button>
    </header>

    <main class="grid-products" id="product-grid" aria-label="Catálogo de productos"></main>

    <!-- Overlay del carrito -->
    <div id="overlay" class="overlay hidden" aria-hidden="true"></div>

    <!-- Carrito lateral -->
    <aside id="cart" class="cart" aria-label="Carrito de compras" aria-modal="true">
      <div class="cart-header">
        <h2>Tu carrito</h2>
        <button id="close-cart" aria-label="Cerrar carrito">✖</button>
      </div>

      <div id="cart-items" class="cart-items" role="list"></div>

      <div class="cart-footer">
        <h3>Total: $<span id="cart-total">0</span></h3>
      </div>
    </aside>

    <footer>
      <p>Tienda Virtual · JS Vanilla</p>
    </footer>

    <!-- Scripts de la tienda -->
    <script src="js/app.js"></script>
    <script src="js/cardEffects.js"></script>
    <script src="js/background.js"></script>
  </body>
</html>
