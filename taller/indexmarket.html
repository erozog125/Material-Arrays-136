<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketplace Moderno</title>

    <link rel="stylesheet" href="styles/styles.css" />

    <!-- ICONOS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body>
    <!-- NAVBAR -->
    <header class="navbar">
      <div class="logo">
        <i class="fa-solid fa-bag-shopping"></i>
        <h2>NovaShop</h2>
      </div>

      <nav>
        <a href="#">Inicio</a>
        <a href="#">Productos</a>
        <a href="#">Ofertas</a>
        <a href="#">Contacto</a>
      </nav>

      <div class="nav-icons">
        <div class="search-box">
          <input type="text" placeholder="Buscar productos..." />
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>

        <div class="cart-icon">
          <i class="fa-solid fa-cart-shopping"></i>
          <span class="cart-count">0</span>
        </div>
      </div>
    </header>

    <!-- HERO -->
    <section class="hero">
      <div class="hero-text">
        <h1>Descubre la nueva colección tecnológica</h1>

        <p>Productos premium con diseño moderno y calidad profesional.</p>

        <button>Comprar Ahora</button>
      </div>
    </section>

    <!-- PRODUCTOS -->
    <section class="products-section">
      <div class="section-title">
        <h2>Productos Destacados</h2>
      </div>

      <!-- AQUÍ SE INSERTAN LOS PRODUCTOS -->
      <div class="products-grid"></div>
    </section>

    <!-- CARRITO -->
    <aside class="cart-panel">
      <div class="cart-header">
        <h2>Carrito</h2>
        <i class="fa-solid fa-xmark"></i>
      </div>

      <div class="cart-item">
        <img
          src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?q=80&w=1000&auto=format&fit=crop"
          alt="iPhone"
        />

        <div class="item-info">
          <h4>iPhone Pro Max</h4>
          <p>$4.000.000</p>
        </div>
      </div>

      <div class="total">
        <h3>Total</h3>
        <span>$4.000.000</span>
      </div>

      <button class="checkout">Finalizar Compra</button>
    </aside>

    <script src="script.js"></script>
  </body>
</html>
