<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <title>FastBite — Tienda de Comida Rápida</title>
</head>

<body>

    <!-- ======= HEADER ======= -->
    <header class="header">
        <div class="header__brand">
            <span class="header__logo">🍔</span>
            <h1 class="header__title">FastBite</h1>
        </div>
        <button class="header__cart-btn" id="cart-toggle">
            <span class="header__cart-icon">🛒</span>
            <span class="header__cart-count" id="cart-count">0</span>
        </button>
    </header>

    <!-- ======= MAIN ======= -->
    <main class="main">

        <!-- Catálogo de productos -->
        <section class="catalog">
            <h2 class="catalog__title">Nuestro Menú</h2>
            <div class="catalog__grid" id="products-container">
                <!-- Las cards se generan dinámicamente con JavaScript -->
            </div>
        </section>

        <!-- Panel del carrito -->
        <aside class="cart" id="cart-panel">
            <div class="cart__header">
                <h2 class="cart__title">Tu Pedido</h2>
                <button class="cart__close" id="cart-close">✕</button>
            </div>
            <div class="cart__items" id="cart-items">
                <!-- Los items del carrito se generan dinámicamente con JavaScript -->
                <p class="cart__empty" id="cart-empty">Tu carrito está vacío 🥺</p>
            </div>
            <div class="cart__footer">
                <div class="cart__total">
                    <span>Total:</span>
                    <span id="cart-total">$0</span>
                </div>
                <button class="cart__checkout">Realizar Pedido</button>
            </div>
        </aside>

        <!-- Overlay para cerrar el carrito en móvil -->
        <div class="overlay" id="overlay"></div>

    </main>

    <!-- ======= FOOTER ======= -->
    <footer class="footer">
        <p class="footer__text">© 2026 FastBite — Hecho con Hambre por Julian Florez 😔</p>
    </footer>

    <script src="market.js"></script>

</body>

</html>
