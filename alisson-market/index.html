<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin Again Records | Tienda de Vinilos</title>
    <link rel="stylesheet" href="Styles/style.css">
</head>
<body>
    <header class="main-header">
        <h1>Spin Again Records</h1>
    </header>

    <main class="app-container">
        <aside class="cart-section">
            <div class="cart-wrapper">
                <h3>Carrito</h3>
                <div id="cart-list">
                    <p class="empty-text">Tu bolsa está vacía</p>
                </div>
                <div class="cart-footer">
                    <p>Total: $<span id="total-price">0.00</span></p>
                    <button class="btn-buy">Comprar</button>
                </div>
            </div>
        </aside>

        <section class="store-front">
            <div class="vynil-grid" id="vynil-grid">
                </div>
        </section>
    </main>

    <footer class="main-footer">
        <p>Spin Again Records &copy; 2026</p>
    </footer>

</body>
<script src="Scripts/Store.js"></script>
<script src="Scripts/Product.js"></script>
</html>
